name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment files
        env:
          LAB_POSTGRES_PASSWORD: ${{ secrets.LAB_POSTGRES_PASSWORD }}
        run: |
          cp .env.example .env
          cat > config/app.env << EOF
          DATABASE_URL=postgresql://barq_app:${LAB_POSTGRES_PASSWORD}@postgres:5432/barq_tasks
          REDIS_URL=redis://redis:6379/0
          EOF

      - name: Syntax check - docker-compose.yml
        run: docker compose -p barq-assessment config > /dev/null

      - name: Syntax check - Python scripts
        run: python3 -m py_compile validate.py failure_test.py app/server.py

      - name: Build images
        run: docker compose -p barq-assessment build

      - name: Start environment
        run: docker compose -p barq-assessment up -d

      - name: Wait for containers to report healthy
        run: |
          for i in $(seq 1 30); do
            total=0
            healthy=0
            for c in app-01 app-02 postgres redis; do
              total=$((total + 1))
              status=$(docker inspect "$c" --format='{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              if [ "$status" = "healthy" ]; then
                healthy=$((healthy + 1))
              fi
            done
            echo "Healthy: $healthy/$total (attempt $i/30)"
            if [ "$healthy" = "$total" ]; then
              echo "All services healthy."
              break
            fi
            sleep 2
          done
          docker compose -p barq-assessment ps -a

      - name: Run validation
        run: python3 validate.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -p barq-assessment logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -p barq-assessment down -v