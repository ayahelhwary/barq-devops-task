name: Build and Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ayahelhwary/barq-assessment-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Apply manifests from Git (image tag = commit SHA)
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmaps.yaml -f k8s/02-postgres.yaml -f k8s/03-redis.yaml -f k8s/05-nginx.yaml
          sed "s#barq-assessment-app:1.0#barq-assessment-app:${GITHUB_SHA}#" k8s/04-apps.yaml | kubectl apply -f -

      - name: Wait for the rollout
        run: |
          for d in postgres redis app-01 app-02 app-03 nginx; do
            kubectl -n barq rollout status deployment/$d --timeout=180s
          done
          kubectl -n barq get pods -o wide
