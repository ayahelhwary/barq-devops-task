name: Build and Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ayahelhwary/barq-assessment-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Roll out new image
        run: |
          for d in app-01 app-02 app-03; do
            kubectl -n barq set image deployment/$d app=${{ env.IMAGE }}:${{ github.sha }}
          done
          for d in app-01 app-02 app-03; do
            kubectl -n barq rollout status deployment/$d --timeout=180s
          done
          kubectl -n barq get pods -o wide
