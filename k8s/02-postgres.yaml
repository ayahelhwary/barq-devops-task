apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: barq
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: barq_app}
            - {name: POSTGRES_DB, value: barq_tasks}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: barq-secrets, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "barq_app", "-d", "barq_tasks"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "barq_app", "-d", "barq_tasks"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        # Lab setup: data lives as long as the pod. Use a PVC for real persistence.
        - name: data
          emptyDir: {}
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: barq
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
